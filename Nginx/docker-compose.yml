services:
    nginx:
      image: nginx
      ports:
        - 8000:80
      volumes:
        - ./nginx/nginx.conf:/etc/nginx/nginx.conf


    redis:
      image: redis
      ports:
       - 6379:6379    

    server:
      build: ./server
      env_file:
        - ./server/.env
      environment:
        - SERVER_NAME="server"
      ports:
        - 5000:3000
    server1:
      build: ./server
      env_file:
        - ./server/.env
      environment:
        - SERVER_NAME="server1"
      ports:
        - 5001:3000
    server2:
      build: ./server
      env_file:
        - ./server/.env
      environment:
        - SERVER_NAME="server2"  
      ports:
        - 5002:3000
    